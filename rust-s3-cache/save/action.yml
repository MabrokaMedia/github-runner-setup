name: Rust S3 cache (save)
description: Upload cargo registry + target/ to same-region S3. Pair with rust-s3-cache/restore.
author: MabrokaMedia

inputs:
  workspace:
    description: Path to the cargo workspace (must match the restore step).
    required: true
  key:
    description: Cache key from the restore step's `key` output. Required — pairs with the restore.
    required: true
  cache-hit:
    description: cache-hit output from the restore step. If "true", save is skipped unless refresh-on-hit is enabled. If explicitly "false", a successful restore hit is refreshed for backward compatibility.
    required: false
    default: ""
  refresh-on-hit:
    description: Save a fresh archive even after a successful restore hit. Use for long Rust builds where target fingerprints drift on persistent self-hosted runners.
    required: false
    default: "false"
  bucket:
    description: S3 bucket name.
    required: false
    default: mabroka-ci-cache-447393542383
  region:
    description: AWS region.
    required: false
    default: us-east-1
  backend:
    description: |
      Where the archive lives. `disk` is a directory on the runner itself,
      `s3` is the bucket, `auto` picks disk on a self-hosted runner and s3 on
      a GitHub-hosted one. Must match the restore step.
    required: false
    default: auto
  cache-dir:
    description: Directory used by the `disk` backend. Shared across runner slots.
    required: false
    default: /opt/gh-runner/cache

runs:
  using: composite
  steps:
    - name: Save cache to S3
      shell: bash
      env:
        AWS_DEFAULT_REGION: ${{ inputs.region }}
        BUCKET: ${{ inputs.bucket }}
        BACKEND: ${{ inputs.backend }}
        CACHE_DIR: ${{ inputs.cache-dir }}
        KEY: ${{ inputs.key }}
        CACHE_HIT_INPUT: ${{ inputs.cache-hit }}
        REFRESH_ON_HIT_INPUT: ${{ inputs.refresh-on-hit }}
      run: |
        set -euo pipefail
        echo "cache key: ${KEY}"
        # The matching restore step writes a sentinel to RUNNER_TEMP after its tar/branch fully
        # succeeds. We refuse to save unless that sentinel says MISS. If restore was cancelled
        # mid-`tar -xf`, the sentinel is absent — saving anyway would tar a half-extracted
        # registry whose hardlink dedup table is inconsistent, producing a poison archive
        # whose `.cargo-ok` files end up linked to unrelated binary content (e.g. .der files).
        # Every subsequent restorer of that key then fails with
        # `unable to read .cargo-ok ... stream did not contain valid UTF-8`.
        STATE_FILE="${RUNNER_TEMP:-/tmp}/rust-s3-cache-state"
        STATE="$(cat "${STATE_FILE}" 2>/dev/null || echo MISSING)"
        CACHE_HIT_INPUT="${CACHE_HIT_INPUT,,}"
        REFRESH_ON_HIT_INPUT="${REFRESH_ON_HIT_INPUT,,}"
        REFRESH_REQUESTED=false
        if [[ "${REFRESH_ON_HIT_INPUT}" == "true" || "${REFRESH_ON_HIT_INPUT}" == "1" || "${REFRESH_ON_HIT_INPUT}" == "yes" ]]; then
          REFRESH_REQUESTED=true
        fi
        # Back-compat: older backend workflows pass cache-hit: 'false' to force
        # a post-build save. Keep honoring that when restore completed as a hit.
        if [[ "${CACHE_HIT_INPUT}" == "false" ]]; then
          REFRESH_REQUESTED=true
        fi
        case "${STATE}" in
          MISS)
            echo "restore confirmed cache miss; proceeding with save"
            ;;
          HIT-COMPLETE)
            if [[ "${REFRESH_REQUESTED}" == "true" ]]; then
              echo "restore was a cache hit; refresh requested, proceeding with save"
            else
              echo "restore was a cache hit; cache already populated, skipping save"
              exit 0
            fi
            ;;
          *)
            echo "restore-state='${STATE}' (expected MISS or HIT-COMPLETE) — restore was interrupted, never ran, or the sentinel was clobbered. Skipping save to avoid uploading an inconsistent registry."
            exit 0
            ;;
        esac
        # Back-compat short-circuit: callers may still pass cache-hit explicitly.
        if [[ "${CACHE_HIT_INPUT}" == "true" && "${REFRESH_REQUESTED}" != "true" ]]; then
          echo "cache already populated (cache-hit=true), skipping save"
          exit 0
        fi
        WORKSPACE_ABS="$(cd "${{ inputs.workspace }}" && pwd)"
        command -v zstd >/dev/null || sudo dnf install -y zstd >/dev/null 2>&1 || sudo apt-get install -y zstd >/dev/null 2>&1
        CARGO_ROOT="${CARGO_HOME:-$HOME/.cargo}"
        PATHS=()
        [[ -d "${WORKSPACE_ABS}/target" ]] && PATHS+=("${WORKSPACE_ABS}/target")
        [[ -d "${CARGO_ROOT}/registry" ]] && PATHS+=("${CARGO_ROOT}/registry")
        [[ -d "${CARGO_ROOT}/git" ]] && PATHS+=("${CARGO_ROOT}/git")
        if [[ ${#PATHS[@]} -eq 0 ]]; then
          echo "no cache paths found, skipping save"
          exit 0
        fi
        echo "saving: ${PATHS[*]}"
        du -sh "${PATHS[@]}" 2>/dev/null || true

        if [ "${BACKEND}" = "auto" ]; then
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then BACKEND=disk; else BACKEND=s3; fi
        fi
        echo "cache backend: ${BACKEND}"

        if [ "${BACKEND}" = "disk" ]; then
          # Same contract as the S3 path: write somewhere private, verify tar
          # was not reading a registry someone else was writing, and only then
          # publish. mv(2) within one filesystem is atomic, so a reader either
          # sees the whole old archive or the whole new one, never a mixture —
          # which is stronger than the server-side copy S3 gives us.
          mkdir -p "${CACHE_DIR}"
          FILE="${CACHE_DIR}/${KEY//\//__}.tar.zst"
          STAGING="${FILE}.staging-${GITHUB_RUN_ID:-noid}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB:-job}"
          TAR_STDERR="$(mktemp)"
          trap 'rm -f "${TAR_STDERR}" "${STAGING}"' EXIT

          tar -cf - "${PATHS[@]}" 2>"${TAR_STDERR}" | zstd -3 --long=27 -T0 -o "${STAGING}" -q -f

          if [[ -s "${TAR_STDERR}" ]]; then
            echo "----- tar stderr -----"; cat "${TAR_STDERR}"; echo "----- end tar stderr -----"
          fi
          if grep -E -q "file changed as we read it|file shrank by|File removed before we read it" "${TAR_STDERR}"; then
            echo "ERROR: tar detected concurrent registry modification. Archive is not internally"
            echo "       consistent and was NOT promoted. The existing cache remains untouched."
            exit 1
          fi

          mv -f "${STAGING}" "${FILE}"
          echo "cache saved: ${FILE} ($(stat -c%s "${FILE}") bytes)"

          # The disk is finite in a way the bucket was not: 100 GB shared by
          # every repo on this host. Drop the least recently used archives once
          # the directory passes its budget, so a busy week cannot fill the
          # root filesystem and take the runners down with it.
          BUDGET_MB="${CACHE_BUDGET_MB:-40000}"
          USED_MB=$(du -sm "${CACHE_DIR}" 2>/dev/null | cut -f1)
          if [ "${USED_MB:-0}" -gt "${BUDGET_MB}" ]; then
            echo "cache dir ${USED_MB} MB exceeds budget ${BUDGET_MB} MB — pruning oldest"
            ls -1t "${CACHE_DIR}"/*.tar.zst 2>/dev/null | tail -n +4 | while read -r old; do
              [ "${old}" = "${FILE}" ] && continue
              rm -f "${old}" && echo "  pruned $(basename "${old}")"
              USED_MB=$(du -sm "${CACHE_DIR}" 2>/dev/null | cut -f1)
              [ "${USED_MB:-0}" -le "${BUDGET_MB}" ] && break
            done
          fi
          exit 0
        fi

        # ----- Atomic upload via staging key -----
        # We never overwrite the canonical key directly. Stream tar|zstd to a per-run staging
        # key, then promote (server-side copy) ONLY if tar's stderr is free of concurrent-
        # modification warnings. If anything looks off, the staging blob is deleted and the
        # canonical cache stays untouched. Worst case: a save is lost; cache is never poisoned.
        STAGING_KEY="${KEY}.staging-${GITHUB_RUN_ID:-noid}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB:-job}.tar.zst"
        TAR_STDERR="$(mktemp)"
        # Always clean up the temp file and any leaked staging blob on exit.
        trap '
          rm -f "${TAR_STDERR}"
          aws s3api head-object --bucket "${BUCKET}" --key "${STAGING_KEY}" >/dev/null 2>&1 \
            && aws s3 rm "s3://${BUCKET}/${STAGING_KEY}" >/dev/null 2>&1 || true
        ' EXIT

        # Pipefail makes any stage failure (tar/zstd/aws) propagate. tar warnings go to stderr
        # and DO NOT affect exit code by default — we grep the captured stderr separately.
        tar -cf - "${PATHS[@]}" 2>"${TAR_STDERR}" \
          | zstd -3 --long=27 -T0 \
          | aws s3 cp - "s3://${BUCKET}/${STAGING_KEY}" --no-progress --expected-size 5000000000

        # Surface tar's stderr verbatim so it shows up in the job log.
        if [[ -s "${TAR_STDERR}" ]]; then
          echo "----- tar stderr -----"
          cat "${TAR_STDERR}"
          echo "----- end tar stderr -----"
        fi

        # Concurrent-modification warnings mean another process was writing to the registry
        # while tar was reading it. The resulting archive can have inconsistent hardlink dedup
        # tables (e.g. `.cargo-ok` linked to a `.der` from a different crate) — exactly the
        # 2026-05-07 incident. Refuse to promote a tainted blob.
        if grep -E -q "file changed as we read it|file shrank by|File removed before we read it" "${TAR_STDERR}"; then
          echo "ERROR: tar detected concurrent registry modification. Local archive is not"
          echo "       internally consistent and was NOT promoted to the canonical cache key."
          echo "       Discarding staging blob. The canonical cache remains untouched."
          exit 1
        fi

        # Promote: server-side copy staging -> canonical. This is atomic for a reader that
        # has not started yet, but NOT for one already mid-download: the CLI pulls large
        # objects with ranged GETs, and a promote landing between two of them serves the
        # tail from the new object, aborting that reader on an ETag mismatch. The restore
        # action therefore treats a failed read as a cache miss rather than a job failure
        # (davoxi-backend#647, 2026-08-12). Do not 'fix' that fallback by assuming this
        # copy protects in-flight readers -- it does not.
        # `--copy-props none` skips tag/metadata preservation — without it, `aws s3 cp` calls
        # GetObjectTagging on the source, which the gh-runner-ec2-role IAM does NOT permit
        # (we don't tag cache objects, so this is purely overhead). Found via 2026-05-07
        # cache-miss runs on davoxi-stripe-identity-business and davoxi-calendar-business.
        # Then drop the staging key. The trap also has a fallback delete just in case.
        aws s3 cp "s3://${BUCKET}/${STAGING_KEY}" "s3://${BUCKET}/${KEY}.tar.zst" --copy-props none --no-progress
        aws s3 rm "s3://${BUCKET}/${STAGING_KEY}"
        echo "cache saved: s3://${BUCKET}/${KEY}.tar.zst"
